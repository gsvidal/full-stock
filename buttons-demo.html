<div class="buttons-demo" style="margin: 80px 0px">
  <p style="font-size: 30px">Buttons demo</p>
  <!-- Primary -->
  <button class="button">Primary</button>

  <!-- Secondary -->
  <button class="button button--secondary">Secondary</button>

  <!-- Outline -->
  <button class="button button--outline">Outline</button>

  <!-- Ghost -->
  <button class="button button--ghost">Ghost</button>

  <!-- Sizes -->
  <button class="button button--sm">Small</button>
  <button class="button button--lg">Large</button>
  <button class="button button--xl">Extra Large</button>

  <!-- With icons -->
  <button class="button">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" />
    </svg>
    Icon Left
  </button>

  <button class="button">
    Icon Right
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" />
    </svg>
  </button>

  <!-- Icon-only sizes -->
  <button class="button button--sm-icon">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" />
    </svg>
  </button>

  <button class="button button--icon">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" />
    </svg>
  </button>

  <button class="button button--lg-icon">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" />
    </svg>
  </button>

  <button class="button button--xl-icon">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" />
    </svg>
  </button>

  <!-- Disabled -->
  <button class="button" disabled>Disabled</button>
</div>
